  <style>
    .sim-selector-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    
    .sim-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    
    .sim-btn.active, .sim-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    
    .animation-display {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      background: var(--card-active);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    
    .visual-coin {
      width: 80px;
      height: 80px;
      background: #f59e0b;
      border: 5px solid #d97706;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 850;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      animation: none;
    }
    
    .visual-die {
      width: 70px;
      height: 70px;
      background: #fff;
      border: 3px solid #e2e8f0;
      color: #0f172a;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    .die-dot {
      background: #0f172a;
      border-radius: 50%;
      width: 8px;
      height: 8px;
      align-self: center;
      justify-self: center;
    }
    
    .visual-card {
      width: 75px;
      height: 105px;
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      color: #ef4444;
      font-size: 1.6rem;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    @keyframes tossCoin {
      0% { transform: scale(1) rotateY(0deg); }
      50% { transform: scale(1.4) rotateY(360deg); }
      100% { transform: scale(1) rotateY(720deg); }
    }
    
    @keyframes rollDie {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); }
    }
    
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }
    
    .stats-table th, .stats-table td {
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.88rem;
    }
    
    .stats-table td:last-child {
      text-align: right;
    <div class="header-inner">

  <main class="tool-page-container">
    <div class="tool-header">
      <p class="eyebrow">Statistics Suite</p>
      <h1>Probability Simulator</h1>
      <p class="tool-description">
        Simulate random experiments and compare experimental percentages to theoretical limits. Test coin flipping, dice rolling, or card drawing with high-speed virtual trials.
      </p>
    </div>

    <div class="tool-grid">
      <!-- Left sidebar panel -->
      <div class="tool-panel tool-card">
        <h2>Choose Experiment</h2>
        <div class="sim-selector-group">
          <button class="sim-btn active" id="btn-sim-coin">Coin Flip</button>
          <button class="sim-btn" id="btn-sim-dice">Roll Dice</button>
          <button class="sim-btn" id="btn-sim-card">Draw Card</button>
        </div>

        <div class="form-group">
          <label for="trials-count">Number of Trials</label>
          <select class="input-control" id="trials-count" aria-label="Simulation trial count selector">
            <option value="1">1 Run</option>
            <option value="10">10 Runs</option>
            <option value="100">100 Runs</option>
            <option value="1000">1,000 Runs</option>
            <option value="10000">10,000 Runs</option>
          </select>
        </div>

        <button class="btn-primary" id="run-btn" style="margin-bottom: 12px;">
          Run Simulation
        </button>
        <button class="btn-secondary" id="reset-btn" style="width: 100%; border-color: var(--danger); color: var(--danger);">
          Reset Statistics
        </button>
      </div>

      <!-- Right main workspace -->
      <div class="tool-output">
        <!-- Animation & outcome preview -->
        <div class="result-card">
          <h2>Latest Outcome</h2>
          <div class="animation-display" id="animation-wrapper">
            <!-- Simulated element will be drawn here -->
            <div class="visual-coin" id="coin-visual">H</div>
          </div>
        </div>

        <!-- Live SVG frequency distribution chart -->
        <div class="result-card">
          <h2>Frequency Distribution Chart</h2>
          <div class="visual-container" id="sim-chart-wrapper" style="min-height: 220px; padding: 12px;">
            <!-- Real-time SVG bar chart -->
          </div>
        </div>

        <!-- Probability table -->
        <div class="result-card">
          <h2>Simulation Statistics</h2>
          <table class="stats-table">
            <thead>
              <tr>
                <th style="text-align: left; font-size: 0.82rem; color: var(--text-muted);">Outcome</th>
                <th style="text-align: center; font-size: 0.82rem; color: var(--text-muted);">Counts</th>
                <th style="text-align: center; font-size: 0.82rem; color: var(--text-muted);">Experimental %</th>
                <th style="text-align: right; font-size: 0.82rem; color: var(--text-muted);">Theoretical %</th>
              </tr>
            </thead>
            <tbody id="stats-tbody">
              <!-- Populated dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Related tools cross-linking -->
