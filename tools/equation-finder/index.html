  <style>
    /* Table modifications */
    .points-table-container {
      margin-bottom: 16px;
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
    }
    
    .points-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .points-table th, .points-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }
    
    .points-table th {
      background: var(--card-active);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .points-table td input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 16px;
    }
    
    .points-table td input:focus {
      outline: none;
    }
    
    .btn-delete {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    
    .btn-delete:hover {
      opacity: 0.8;
    }
    
    .table-actions {
    <div class="header-inner">
      <a href="/" class="brand" aria-label="profpi home">

      <nav class="site-nav" id="site-nav">
        <a href="/#tools">Tools</a>
        <a href="/#features">Why profpi</a>
        <a href="/tools/graphing-calculator/" class="nav-cta">Open Graphing Calculator</a>
      </nav>

      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg id="theme-toggle-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"
          viewBox="0 0 24 24"></svg>
      </button>

      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>
    </div>
  </header>

  <main class="tool-page-container">
    <div class="tool-header">
      <p class="eyebrow">Algebraic Suite</p>
      <h1>Equation Finder</h1>
      <p class="tool-description">
        Enter coordinate points in the table below to fit the best mathematical curve. Supported fits include Linear, Quadratic, Exponential, and Logarithmic equations.
      </p>
    </div>

    <div class="tool-grid">
      <!-- Left sidebar panel -->
      <div class="tool-panel tool-card">
        <h2>Enter Data Points</h2>
        <div class="error-alert" id="error-alert">Invalid coordinate inputs.</div>
        
        <div class="points-table-container">
          <table class="points-table">
            <thead>
              <tr>
                <th style="width: 45%;">X Coordinate</th>
                <th style="width: 45%;">Y Coordinate</th>
                <th style="width: 10%;"></th>
              </tr>
            </thead>
            <tbody id="points-tbody">
              <!-- Points added here dynamically -->
            </tbody>
          </table>
        </div>
        
        <div class="table-actions">
          <button class="btn-secondary" id="add-row-btn" style="padding: 8px 16px; font-size: 0.85rem;">
            + Add Point
          </button>
          <button class="btn-secondary" id="clear-rows-btn" style="padding: 8px 16px; font-size: 0.85rem; border-color: var(--danger); color: var(--danger);">
            Clear All
          </button>
        </div>
        
        <div class="form-group">
          <label for="fit-model-select">Fit Model</label>
          <select class="input-control" id="fit-model-select" aria-label="Regression Fit Model">
            <option value="auto">Auto-detect Best Fit</option>
            <option value="linear">Linear (y = mx + c)</option>
            <option value="quadratic">Quadratic (y = ax² + bx + c)</option>
            <option value="exponential">Exponential (y = a · e^(bx))</option>
            <option value="logarithmic">Logarithmic (y = a · ln(x) + b)</option>
          </select>
        </div>
        
        <button class="btn-primary" id="fit-btn">
          Fit Equation &amp; Plot
        </button>
      </div>

      <!-- Right main workspace -->
      <div class="tool-output">
        <!-- Visualization Area -->
        <div class="result-card">
          <h2>Fitted Curve Chart</h2>
          <div class="visual-container" id="chart-wrapper">
            <!-- SVG chart is rendered here -->
          </div>
        </div>

        <!-- Math results & coefficients -->
        <div class="result-card" id="results-display">
          <h2>Fit Performance &amp; Formula</h2>
          <div class="result-formula" id="formula-output">y = 2.500x + 1.200</div>
          
          <div class="result-steps" style="border-top:none; padding-top:0;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem;">
              <span>Fitted Model Type:</span>
              <strong id="model-type-output">Linear</strong>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem;">
              <span>R-Squared (R²):</span>
              <strong id="r2-output">0.998</strong>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-color);" id="r2-desc">
              R-Squared measures how close the data points are to the fitted regression curve. An R² of 1.0 indicates a perfect fit.
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Related tools cross-linking -->
